# CI Android Saku-Ku. Tiap push/PR: build APK debug + unit test (JVM), APK-nya bisa diunduh
# dari tab Actions (Artifacts). Build release (R8 + tanda tangan) jalan manual lewat
# "Run workflow" - butuh 4 secret keystore, lihat job release di bawah.
name: Android CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Sekalian build APK release (butuh secret keystore)"
        type: boolean
        default: false

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties minta JDK 25 buat daemon Gradle.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # gradlew yang di-commit dari Windows sering kehilangan izin eksekusi.
      - run: chmod +x gradlew

      - name: Build debug + unit test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload APK debug
        uses: actions/upload-artifact@v4
        with:
          name: sakuku-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload laporan unit test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Dibaca app/build.gradle.kts lewat signingValue(..., "ANDROID_...") kalau
      # keystore.properties gak ada.
      ANDROID_KEYSTORE_PATH: release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # keystore.properties (kalau masih ke-commit) nunjuk ke keys/*.jks di laptop - dibuang biar
      # build.gradle.kts pakai env ANDROID_* di atas.
      - name: Pasang keystore dari secret
        run: |
          rm -f keystore.properties
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      - name: Build release (R8)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK release
        uses: actions/upload-artifact@v4
        with:
          name: sakuku-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
